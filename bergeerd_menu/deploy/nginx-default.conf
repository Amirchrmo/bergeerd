server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Go API ----
    location /api/ {
        proxy_pass http://bergeerd-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://bergeerd-api:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ---- MinIO public images ----
    # URLs: https://bergeerd.ir/bergeerd-minio/bergeerd/menu/<file>
    #   ->  http://sansyar-minio:9000/bergeerd/menu/<file>
    location /bergeerd-minio/ {
        proxy_pass http://sansyar-minio:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Admin panel (built with base=/admin/, files in /admin/) ----
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # Long cache for hashed assets (website + admin)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /admin/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- Public website SPA ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
